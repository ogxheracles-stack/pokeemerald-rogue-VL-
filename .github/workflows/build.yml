name: Victory League Alpha Build

on:
  push:
    branches: [ main, master, vanilla ]
  pull_request:
    branches: [ main, master, vanilla ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev wget git make unzip

      - name: Install poryscript & config
        run: |
          mkdir -p tools/poryscript/poryscript-linux
          wget -q https://github.com/huderlem/poryscript/releases/latest/download/poryscript-linux.zip -O /tmp/poryscript.zip
          unzip -o /tmp/poryscript.zip -d /tmp/poryscript_extract
          
          # Move the translator binary to the exact spot the Makefile expects
          cp /tmp/poryscript_extract/poryscript-linux/poryscript tools/poryscript/poryscript-linux/poryscript
          chmod +x tools/poryscript/poryscript-linux/poryscript
          
          # THE FIX: Move the "dictionary" to the main root folder
          cp /tmp/poryscript_extract/poryscript-linux/command_config.json .
          
          sudo ln -sf $GITHUB_WORKSPACE/tools/poryscript/poryscript-linux/poryscript /usr/local/bin/poryscript

      - name: Clone and install agbcc
        run: |
          git clone https://github.com/pret/agbcc.git /tmp/agbcc
          cd /tmp/agbcc
          ./build.sh
          ./install.sh $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE

      - name: Build native tools
        run: |
          make tools -j$(nproc)

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victory-League-Alpha-2.4
          path: "*.gba"
